project:
  packs:
    - pack: Nuvoton::NuMicroM33_DFP@^1.0.3
  setups:
    - setup: Options for FreeRTOS
      processor:
        fpu: sp
      add-path:
        - ..
        - ../../../../Library/CMSIS/Core/Include
        - ../../../../Library/Device/Nuvoton/m3331/Config
        - ../../../../Library/Device/Nuvoton/m3331/Include
        - ../../../../Library/StdDriver/inc
        - ../../../../ThirdParty/FreeRTOS/include
        - ../../../../ThirdParty/FreeRTOS/Demo/Common/include
        - ../../../../ThirdParty/FreeRTOS/portable/GCC/ARM_CM33_NTZ/non_secure
        - ../../../../ThirdParty/cJSON
        - ../nualink/include
      debug: "on"
      define:
        - __MICROLIB
      define-asm:
        - __MICROLIB
      misc:
        - C:
            - -std=c99
            - -Wno-nan-infinity-disabled
          C-CPP:
            - -fno-rtti
            - -funsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
          CPP:
            - -xc++
            - -std=c++11
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --library_type=microlib
            - --map
            - --load_addr_map_info
            - --symbols
            - --info sizes
            - --info totals
            - --map --datacompressor=off --info=inline --entry Reset_Handler
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: ../../../../Library/Device/Nuvoton/m3331/Config/m3331_ac6.sct
  groups:
    - group: System
      files:
        - file: ../../../../Library/Device/Nuvoton/m3331/Source/startup_m3331.c
        - file: ../../../../Library/Device/Nuvoton/m3331/Source/system_m3331.c
    - group: NuAILink App
      files:
        - file: ../FreeRTOSConfig.h
        - file: ../main.c
    - group: NuAILink SDK
      files:
        - file: ../nualink/include/nualink_config.h
        - file: ../nualink/include/nualink_board.h
        - file: ../nualink/include/nualink_tasks.h
        - file: ../nualink/include/nualink_transport.h
        - file: ../nualink/include/mcp_types.h
        - file: ../nualink/include/mcp_registry.h
        - file: ../nualink/include/mcp_response.h
        - file: ../nualink/include/mcp_jsonrpc.h
        - file: ../nualink/src/platform/nualink_board.c
        - file: ../nualink/src/platform/nualink_tasks.c
        - file: ../nualink/src/transport/nualink_usb_cdc.c
        - file: ../nualink/src/transport/nualink_usb_descriptors.c
        - file: ../nualink/src/core/mcp_registry.c
        - file: ../nualink/src/core/mcp_jsonrpc.c
        - file: ../nualink/src/core/mcp_response.c
        - file: ../nualink/src/plugins/plugin_system.c
        - file: ../nualink/src/plugins/plugin_led_gpio.c
        - file: ../nualink/src/plugins/plugin_gpio.c
        - file: ../nualink/src/plugins/plugin_eadc.c
    - group: FreeRTOS files
      files:
        - file: ../../../../ThirdParty/FreeRTOS/tasks.c
        - file: ../../../../ThirdParty/FreeRTOS/timers.c
        - file: ../../../../ThirdParty/FreeRTOS/list.c
        - file: ../../../../ThirdParty/FreeRTOS/queue.c
        - file: ../../../../ThirdParty/FreeRTOS/portable/GCC/ARM_CM33_NTZ/non_secure/port.c
        - file: ../../../../ThirdParty/FreeRTOS/portable/MemMang/heap_4.c
        - file: ../../../../ThirdParty/FreeRTOS/portable/GCC/ARM_CM33_NTZ/non_secure/portasm.c
    - group: ThirdParty
      files:
        - file: ../../../../ThirdParty/cJSON/cJSON.c
        - file: ../../../../ThirdParty/cJSON/cJSON.h
    - group: BSP Drivers
      files:
        - file: ../../../../Library/StdDriver/src/clk.c
        - file: ../../../../Library/StdDriver/src/retarget.c
        - file: ../../../../Library/StdDriver/src/sys.c
        - file: ../../../../Library/StdDriver/src/uart.c
        - file: ../../../../Library/StdDriver/src/gpio.c
        - file: ../../../../Library/StdDriver/src/timer.c
        - file: ../../../../Library/StdDriver/src/hsusbd.c
        - file: ../../../../Library/StdDriver/src/pdma.c
        - file: ../../../../Library/StdDriver/src/eadc.c
        - file: ../../../../Library/StdDriver/src/epwm.c
        - file: ../../../../Library/StdDriver/src/bpwm.c
        - file: ../../../../Library/StdDriver/src/i2c.c
        - file: ../../../../Library/StdDriver/src/usci_i2c.c
        - file: ../../../../Library/StdDriver/src/usci_uart.c
        - file: ../../../../Library/StdDriver/src/llsi.c
        - file: ../../../../Library/StdDriver/src/ellsi.c
